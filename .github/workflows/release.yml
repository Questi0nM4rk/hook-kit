# ============================================================================
#  release — publishes to npm when a v* tag is pushed.
# ----------------------------------------------------------------------------
#  Auth is npm trusted publishing (OIDC from this workflow): no NPM_TOKEN, no
#  secrets. The package's npmjs.com settings must name this file (release.yml)
#  as its trusted publisher, and that publisher is stage-only. npm stage publish
#  runs prepublishOnly, which builds the types the package exports (dist/types)
#  and runs verify, then puts the version in the npm stage queue: it is not live
#  until a maintainer approves it on npmjs.com (2FA).
# ============================================================================
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version package.json)"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm
        run: npm install -g npm@^11.15.0 # npm stage needs npm 11.15.0 or newer; setup-node bundles 11.11.0
      - name: Stage on npm
        run: npm stage publish --access public --provenance
