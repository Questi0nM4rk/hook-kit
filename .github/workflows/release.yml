# ============================================================================
#  release — publishes to npm when a v* tag is pushed.
# ----------------------------------------------------------------------------
#  Auth is npm trusted publishing (OIDC from this workflow): no NPM_TOKEN, no
#  secrets. The package's npmjs.com settings must name this file (release.yml)
#  as its trusted publisher. npm publish runs prepublishOnly, which builds the
#  types the package exports (dist/types) and runs verify before the upload.
# ============================================================================
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(jq -r .version package.json)"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - name: Test
        run: bun test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Ensure npm 11.5.1 or newer (trusted publishing)
        run: |
          lowest="$(printf '%s\n' 11.5.1 "$(npm --version)" | sort -V | head -n 1)"
          if [ "$lowest" != 11.5.1 ]; then npm install -g npm@latest; fi
          npm --version
      - name: Publish
        run: npm publish --access public --provenance
