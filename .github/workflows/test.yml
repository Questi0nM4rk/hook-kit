name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-stable-exports needs the base ref reachable to diff against;
          # fetch full history on PRs so origin/<base> resolves to a real commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Check STABLE-export removals
        # Skip on direct pushes to main — there's no PR base to diff against;
        # the guard runs on every PR before merge.
        if: github.event_name == 'pull_request'
        env:
          # Indirect via env so github.base_ref can't shell-inject the run step.
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-stable-exports.ts --base "origin/$BASE_REF"
      - name: Check CHANGELOG [Unreleased] discipline
        # PR-only; same shell-injection-safe env indirection.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-changelog.ts --base "origin/$BASE_REF"
      - name: Check inline suppression-comment reasons
        # Runs on every push/PR -- no base ref needed; --all scans the full
        # tree (CI has no staged set to drive the per-file lefthook variant).
        run: bun scripts/check-suppress-comments.ts --all
      - name: Check cross-doc count claims
        # CI-only (per L-S4-1, content checks live in CI not pre-commit).
        # Audits HookKitError subclass count + package.json subpath export targets.
        run: bun scripts/check-doc-counts.ts
      - name: Check cross-doc table sync (Output convention)
        # CI-only; asserts CLAUDE.md and docs/ADAPTERS.md Output-convention
        # tables stay byte-identical (intentionally duplicated per TASK-024).
        run: bun scripts/check-output-table.ts

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        # --config auto = semgrep registry default ruleset (security + ecosystem).
        # --error makes any finding fail the job (CP-1: no warn, only error).
        # Excludes mirror the lefthook hook-scope spirit: skip tests/fixtures/docs/examples.
        run: |
          pip install semgrep
          semgrep --config auto --error --exclude tests/ --exclude tests-isolated/ --exclude examples/ --exclude docs/

  markdown:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Markdownlint
        # Broader scope than lefthook (which only sees staged files and excludes
        # docs/plans|specs). Catches doc drift from contributors without the
        # local hook. CI scans all *.md except node_modules / dist; the `#`
        # prefix is markdownlint-cli2's exclude-glob syntax.
        run: bunx --bun markdownlint-cli2 "**/*.md" "#node_modules/**" "#dist/**"
