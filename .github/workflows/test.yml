name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The PR-only checks (check-stable-exports / check-changelog) need the
          # base ref reachable to diff against; fetch full history on PRs so
          # origin/<base> resolves to a real commit.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install deps
        run: bun install --frozen-lockfile
      # Single gate. `bun run verify` runs lint + the full 3-process test split
      # + the suppression/doc/table checks + markdownlint, and — on PRs — the
      # PR-only stability guards against the base ref. verify collects failures
      # (never stops at the first) and names each failed check in its summary.
      - name: Verify (PR)
        # On PRs, pass the base ref so the PR-only checks run. Indirect via env
        # so github.base_ref can't shell-inject the run step.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run verify --base "origin/$BASE_REF"
      - name: Verify (push)
        # On direct pushes to main there is no PR base; verify auto-skips the
        # PR-only checks internally.
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          bun run verify 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Publish badges
        # Force-pushes one commit to the badges branch; shields.io reads it from there.
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/test.log"
          out="$RUNNER_TEMP/badges"; mkdir -p "$out"
          badge() { printf '{"schemaVersion":1,"label":"%s","message":"%s","color":"%s"}\n' "$2" "$3" "$4" > "$out/$1.json"; }
          # verify runs three bun test suites, each printing its own summary: sum them.
          pass=0; fail=0
          for n in $(grep -Eo '^ *[0-9]+ pass' "$log" 2>/dev/null | grep -Eo '[0-9]+'); do pass=$((pass + n)); done
          for n in $(grep -Eo '^ *[0-9]+ fail' "$log" 2>/dev/null | grep -Eo '[0-9]+'); do fail=$((fail + n)); done
          # No summary at all means the suites never ran: that is red, not green.
          if [ "$fail" != 0 ] || [ "$pass" = 0 ]; then color=red; else color=brightgreen; fi
          badge tests tests "$pass passed, $fail failed" "$color"
          cd "$out"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "badges for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run semgrep
        # --config auto = semgrep registry default ruleset (security + ecosystem).
        # --error makes any finding fail the job (CP-1: no warn, only error).
        # Excludes mirror the lefthook hook-scope spirit: skip tests/fixtures/docs/examples.
        run: |
          pip install semgrep
          semgrep --config auto --error --exclude tests/ --exclude tests-isolated/ --exclude examples/ --exclude docs/
