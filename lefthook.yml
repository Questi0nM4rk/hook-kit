# hook-kit pre-commit + commit-msg hooks. See docs/SPEC.md / lessons L4 (no paragraphs in config headers).
# gitleaks/codespell are system tools (not npm). Install: gitleaks via `yay -S gitleaks` (Arch) / `brew install gitleaks` (mac) / github releases; codespell via `pipx install codespell` (recommended) or `pip install --user codespell`.
# No gitleaks.toml baseline: default ruleset is fine — add a baseline only if false positives appear.
pre-commit:
  commands:

    biome-fix:
      glob: "*.{ts,tsx,js,jsx}"
      exclude: '(node_modules/.*|dist/.*|\.claude/.*|docs/plans/.*|docs/specs/.*)'
      # bunx ensures the project-pinned @biomejs/biome (2.4.15) runs, not /usr/bin/biome (system).
      # System biome may not know rules / config keys that the pinned version uses.
      run: bunx --bun biome check --write {staged_files} && git add {staged_files}
      stage_fixed: true
      priority: 1

    gitleaks:
      run: gitleaks protect --staged --no-banner
      fail_text: "Potential secrets detected"
      priority: 2

    codespell:
      glob: "*.{ts,md,txt,yaml,yml,toml,json,py,go,rs}"
      exclude: '(node_modules/.*|dist/.*|\.claude/.*|docs/plans/.*|docs/specs/.*|bun\.lock)'
      run: codespell --check-filenames {staged_files}
      fail_text: "Spell errors found"
      priority: 2

    markdownlint:
      glob: "*.md"
      exclude: '(node_modules/.*|dist/.*|\.claude/.*|docs/plans/.*|docs/specs/.*)'
      run: markdownlint-cli2 {staged_files}
      fail_text: "Markdown lint errors found"
      priority: 2

    suppress-comments:
      glob: "*.{ts,tsx,js,jsx}"
      exclude: '(node_modules/.*|dist/.*|\.claude/.*|docs/plans/.*|docs/specs/.*)'
      # bun runs the local TS script directly. bunx resolves package names, not
      # filesystem paths -- L-S2-4 applies to devDep invocations (biome, eslint),
      # not local scripts. Mirrors the CI invocation in .github/workflows/test.yml.
      run: bun scripts/check-suppress-comments.ts {staged_files}
      fail_text: "Inline suppression comments require a >=10-char reason; bare or generic suppressions blocked"
      priority: 2

commit-msg:
  commands:
    conventional:
      run: grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:" {1}
      fail_text: "Commit message must follow Conventional Commits format"
